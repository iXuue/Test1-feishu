[project]
name = "codecub"
version = "0.1.0"
description = "CodeCub local desktop-first coding agent with the Pico Harness compatibility surface"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSES/*", "NOTICES.md"]
keywords = ["ai", "agent", "cli", "terminal", "context-management", "skill-evolution"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "typer>=0.20.0,<1.0.0",
  "litellm>=1.82.1,<1.92.0",
  "pydantic>=2.12.0,<3.0.0",
  "pydantic-settings>=2.14.2,<3.0.0",
  "httpx>=0.28.0,<1.0.0",
  "loguru>=0.7.3,<1.0.0",
  "rich>=14.0.0,<15.0.0",
  "croniter>=6.0.0,<7.0.0",
  "pyyaml>=6.0",
  "prompt-toolkit>=3.0.0",
  "json-repair>=0.30.0",
  "tiktoken>=0.7.0,<1.0.0",
  "questionary>=2.0.0,<3.0.0",
  "watchfiles>=0.21,<2.0",
  "tomli-w>=1.2.0",
  "oauth-cli-kit>=0.1.6,<1.0.0",
  "portalocker>=3.2.0",
  "mcp>=1.27.0,<2.0.0",
  "orjson>=3.11.6,<4.0",
  "numpy>=2.0,<3.0",
  "pillow>=12.3,<13.0",
  "packaging>=24.0,<26.0",
]

[project.optional-dependencies]
tokenizers = ["tiktoken>=0.8.0,<1.0.0"]
redis = ["redis>=5"]
channel-feishu = ["lark-oapi>=1.5.0,<2.0.0"]
channel-wecom = ["wecom-aibot-sdk-python>=0.1.5"]
channel-qq = ["qq-botpy>=1.2.0,<2.0.0"]
channels = [
  "lark-oapi>=1.5.0,<2.0.0",
  "wecom-aibot-sdk-python>=0.1.5",
  "qq-botpy>=1.2.0,<2.0.0",
]
tools = [
  "readability-lxml>=0.8.4,<1.0.0",
  "oauth-cli-kit>=0.1.6,<1.0.0",
]
retrieval = [
  "torch>=2.0.0",
  "transformers>=4.45.0",
]
sandbox = [
  "boxlite==0.9.5",
  "anyio>=4.0",
]
dev = [
  "json-repair>=0.59.5",
  "oauth-cli-kit>=0.1.6",
  "pexpect>=4.9",
  "pip-audit>=2.10.0",
  "pre-commit>=4.6.0",
  "pyte>=0.8",
  "pytest>=9.0.3",
  "pytest-asyncio>=1.3.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.15.11,<0.16",
  "sqlmodel>=0.0.27,<1.0.0",
  "pyinstaller>=6.20.0",
]
eval = []

[project.scripts]
codecub = "codecub.cli:main"
pico = "pico.cli.commands:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["pico", "codecub"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build]
include = [
  "pico/**/*.py",
  "pico/plugin/**/pico-plugin.toml",
  "pico/templates/**/*.md",
  "pico/skills/**/*.md",
  "pico/skills/**/*.sh",
  "pico/tracing/viewer/**/*.js",
  "pico/tracing/viewer/**/*.css",
  "pico/tracing/viewer/**/*.html",
  "pico/tracing/viewer/**/*.json",
  "codecub/**/*.py",
]

[tool.hatch.build.targets.sdist]
include = [
  "pico/",
  "codecub/",
  "hatch_build.py",
  "README.md",
  "LICENSE",
  "LICENSES/",
  "NOTICES.md",
]

[tool.hatch.build.targets.sdist.force-include]
"ui-tui/dist/entry.js" = "ui-tui/dist/entry.js"

[tool.uv]
constraint-dependencies = [
  "aiohttp>=3.13.4",
  "pip>=26.1.2",
  "pyjwt>=2.13.0",
  "python-engineio>=4.13.3",
  "python-dotenv>=1.2.2",
  "starlette>=1.3.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
  ".workbuddy",
  "benchmarks/**/data",
  "benchmarks/**/results",
  "benchmarks/**/output",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "S101", "S105", "S106", "S107", "S506", "S605", "S607"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402", "E741", "F811", "F841", "N802", "N805", "N806", "N817", "N818", "S101", "S105", "S106", "S107", "S607"]
"pico/tracing/instrument.py" = ["N803"]
"pico/cli/commands.py" = ["E402"]
"pico/cli/cron_commands.py" = ["E402"]
"pico/eval_engine/engine.py" = ["E402"]
"pico/memory_engine/skill_local/registry.py" = ["E402"]
"scripts/skill_forge_full_e2e.py" = ["E402"]
"pico/agent/subagent/manager.py" = ["S101"]
"pico/cli/doctor_commands.py" = ["S101"]
"pico/cli/onboard_commands.py" = ["S101"]
"pico/memory_engine/contract_test.py" = ["S101"]
"scripts/check_commit_file.py" = ["S607"]
"scripts/check_commit_messages.py" = ["S607"]
"scripts/check_large_files.py" = ["S607"]
"pico/evolver/tree/git_ops.py" = ["S607"]
"pico/evolver/launch/config.py" = ["S607"]
"pico/evolver/launch/contract.py" = ["S607"]
"pico/evolver/launch/runner.py" = ["S607"]
"pico/evolver/orchestrator/nodes/semantic.py" = ["S101"]
"pico/evolver/scheduler/cold_start_bandit.py" = ["N803", "N806"]
"pico/evolver/scheduler/tree_aware_bandit.py" = ["N803"]
"pico/evolver/scheduler/tree_loader.py" = ["S101"]
"pico/evolver/analysis/stability_bucket.py" = ["S105"]
"pico/evolver/applier/beacon_guard.py" = ["S105"]
"pico/evolver/judge/prompts.py" = ["S105"]
"benchmarks/appworld/evolve/adapter.py" = ["N803", "S105"]
"benchmarks/appworld/evolve/editor.py" = ["N806"]
"benchmarks/appworld/evolve/sandbox.py" = ["S607"]
"benchmarks/clawbench/stream.py" = ["S607"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = ["artifacts"]
addopts = [
  "--ignore=tests/pico_upstream",
  "--ignore=tests/tui",
  "-m",
  "not (slow or benchmark or real_llm or llm_judge or real_vm or real_channel or external_runtime or e2e)",
]
markers = [
  "slow: long-running tests excluded from the default pytest run",
  "benchmark: benchmark and metrics tests excluded from the default pytest run",
  "real_llm: calls a live model or embedding endpoint and may incur cost; opt-in",
  "llm_judge: uses an LLM as a grader for extraction quality; opt-in",
  "real_vm: boots or connects to a real virtual machine; opt-in",
  "real_channel: connects to an external messaging channel; opt-in",
  "external_runtime: requires a runtime or executable outside the Python test environment; opt-in",
  "e2e: spawns a real subprocess through the TUI autotest runtime; opt-in",
]

[dependency-groups]
dev = [
  "json-repair>=0.59.5",
  "oauth-cli-kit>=0.1.6",
  "pexpect>=4.9",
  "pip-audit>=2.10.0",
  "pre-commit>=4.6.0",
  "pyte>=0.8",
  "pytest>=9.0.3",
  "pytest-asyncio>=1.3.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.15.11,<0.16",
  "sqlmodel>=0.0.27,<1.0.0",
  "pyinstaller>=6.20.0",
]
